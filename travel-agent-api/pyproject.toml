[project]
name = "travel-agent-api"
version = "0.1.0"
description = "Assistente di viaggio intelligente (FastAPI + LangChain)"
authors = [
    {name = "Adriano Germinal",email = "adrianogerminal@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi (>=0.143.1,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "openai (>=3.31.0,<4.0.0)",
    "langchain-openai (>=1.7.2,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langgraph (>=1.2.15,<2.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "google-search-results (>=2.4.2,<3.0.0)"
]

[tool.poetry]
packages = [{include = "travel_agent_api"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
